  <script>
    // --- KHO DỮ LIỆU ĐẦY ĐỦ 35 CÂU CHO ĐỀ 1 & ĐỀ 2 ---
    const ALL_EXAMS = {
      de1: {

        duration: 60,
        questions: [
          // PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN (25 CÂU)
          {
            id: 1, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,
            question: "Cho số phức $z = 1 + i$. Giá trị của $z^{2026}$ dưới dạng đại số là:",
            options: ["$2^{1013}i$", "$-2^{1013}i$", "$2^{1013}$", "$-2^{1013}$"], answer: 0,
            explanation: "$(1+i)^2 = 2i \\implies (1+i)^{2026} = (2i)^{1013} = 2^{1013}i$ (vì $1013 = 4 \\times 253 + 1$)."

          {

            options: ["$6$", "$8$", "$10$", "$5$"], answer: 0,
            explanation: "Tổng các giá trị riêng bằng vết của ma trận: $\\operatorname{tr}(A) = 3 + 4 + (-1) = 6$."
          },
          {
            id: 4, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

          {
            id: 5, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

          {

            id: 8, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

            id: 10, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

            id: 14, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

            explanation: "$\\det(2A) = 2^3 \\cdot \\det(A) = 8 \\times 5 = 40$."

          {
            id: 15, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,

            explanation: "Các định thức con chính dương $\\implies \\Delta_2 = m - 4 > 0 \\implies m > 4$."

          {

          {
            id: 17, section: "PHẦN I: TRẮC NGHIỆM NHIỀU LỰA CHỌN", type: "mcq", points: 0.2,
            question: "Định thức Vandermonde cấp 3 với các biến $1, 2, 3$ có giá trị bằng:",

            question: "Cho số phức $z = -1 - i\\sqrt{3}$. Dạng lượng giác của $z$ là:",

            explanation: "Hai trị riêng là nghiệm của $\\lambda^2 - 5\\lambda + 6 = 0 \\implies \\lambda_1 = 2, \\lambda_2 = 3$. Do đó $\\operatorname{tr}(A^3) = 2^3 + 3^3 = 8 + 27 = 35$."
          }
        ]
      }
    };

    let currentExamKey = "de1";
    let userAnswers = {};
    let isSubmitted = false;
    let secondsLeft = 60 * 60;
    let timerInterval;

    function initSelector() {
      const select = document.getElementById("exam-select");
      if(!select) return;
      select.innerHTML = "";
      for (let key in ALL_EXAMS) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.innerText = ALL_EXAMS[key].title;
        select.appendChild(opt);
      }
      select.value = currentExamKey;
    }

    function changeExam(key) {
      currentExamKey = key;
      userAnswers = {};
      isSubmitted = false;
      document.getElementById("result-banner").classList.add("hidden");
      document.getElementById("submit-bar").classList.remove("hidden");
      
      clearInterval(timerInterval);
      secondsLeft = ALL_EXAMS[key].duration * 60;
      startTimer();
      renderQuiz();
    }

    function renderQuiz() {
      const exam = ALL_EXAMS[currentExamKey];
      document.getElementById("exam-title-header").innerText = exam.title;
      const container = document.getElementById("quiz-container");
      container.innerHTML = "";
      let currentSection = "";

      exam.questions.forEach((q, idx) => {
        if (q.section !== currentSection) {
          currentSection = q.section;
          const secHeader = document.createElement("div");
          secHeader.className = "bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-sm tracking-wide shadow-sm mt-6";
          secHeader.innerText = currentSection;
          container.appendChild(secHeader);
        }

        const card = document.createElement("div");
        card.id = `q-card-${q.id}`;
        card.className = "bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 transition";

        let html = `<div class="font-semibold text-slate-900 mb-3 leading-relaxed"><span class="text-blue-600 font-bold">Câu ${idx + 1}.</span> ${q.question}</div>`;

        if (q.type === "mcq") {
          const letters = ["A", "B", "C", "D"];
          html += `<div class="space-y-2.5">`;
          q.options.forEach((opt, optIdx) => {
            html += `
              <label id="opt-${q.id}-${optIdx}" class="flex items-center gap-3 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 transition">
                <input type="radio" name="q_${q.id}" value="${optIdx}" onchange="saveMCQ(${q.id}, ${optIdx})" class="w-4 h-4 text-blue-600">
                <span class="font-bold text-slate-700">${letters[optIdx]}.</span>
                <span class="text-slate-800">${opt}</span>
              </label>`;
          });
          html += `</div>`;
        } else if (q.type === "tf") {
          html += `<div class="divide-y divide-slate-100 border border-slate-200 rounded-lg overflow-hidden">`;
          q.subQuestions.forEach((sub, sIdx) => {
            html += `
              <div id="tf-row-${q.id}-${sIdx}" class="p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white">
                <div class="text-sm text-slate-800"><span class="font-bold">${sub.label}</span> ${sub.text}</div>
                <div class="flex gap-2 shrink-0">
                  <button type="button" id="btn-tf-${q.id}-${sIdx}-true" onclick="saveTF(${q.id}, ${sIdx}, true)" class="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 text-slate-600">ĐÚNG</button>
                  <button type="button" id="btn-tf-${q.id}-${sIdx}-false" onclick="saveTF(${q.id}, ${sIdx}, false)" class="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 text-slate-600">SAI</button>
                </div>
              </div>`;
          });
          html += `</div>`;
        } else if (q.type === "short") {
          html += `
            <div class="mt-2">
              <input type="text" id="short-input-${q.id}" oninput="saveShort(${q.id}, this.value)" placeholder="Nhập đáp số..." class="w-full sm:w-64 px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-semibold">
            </div>`;
        }

        html += `
          <div id="exp-${q.id}" class="hidden mt-4 p-3.5 rounded-lg bg-amber-50 border border-amber-200 text-sm text-slate-700">
            <div class="font-bold text-amber-800 mb-1">💡 Lời giải & Phân tích:</div>
            <div>${q.explanation}</div>
          </div>`;

        card.innerHTML = html;
        container.appendChild(card);
      });

      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });
    }

    function saveMCQ(qId, optIdx) { if (!isSubmitted) userAnswers[qId] = optIdx; }
    function saveTF(qId, sIdx, val) {
      if (isSubmitted) return;
      if (!userAnswers[qId]) userAnswers[qId] = {};
      userAnswers[qId][sIdx] = val;
      const bT = document.getElementById(`btn-tf-${qId}-${sIdx}-true`);
      const bF = document.getElementById(`btn-tf-${qId}-${sIdx}-false`);
      bT.className = val === true ? "px-3 py-1.5 text-xs font-bold rounded bg-blue-600 text-white" : "px-3 py-1.5 text-xs font-bold rounded border border-slate-300 text-slate-600";
      bF.className = val === false ? "px-3 py-1.5 text-xs font-bold rounded bg-blue-600 text-white" : "px-3 py-1.5 text-xs font-bold rounded border border-slate-300 text-slate-600";
    }
    function saveShort(qId, val) { if (!isSubmitted) userAnswers[qId] = val.trim().replace(",", "."); }

    function startTimer() {
      timerInterval = setInterval(() => {
        secondsLeft--;
        const m = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
        const s = String(secondsLeft % 60).padStart(2, "0");
        const tBox = document.getElementById("timer-box");
        if(tBox) tBox.innerText = `${m}:${s}`;
        if (secondsLeft <= 0) { clearInterval(timerInterval); submitQuiz(true); }
      }, 1000);
    }

    function submitQuiz(auto = false) {
      if (isSubmitted) return;
      if (!auto && !confirm("Bạn chắc chắn muốn nộp bài chứ?")) return;

      isSubmitted = true;
      clearInterval(timerInterval);
      let totalScore = 0, maxScore = 0;
      const exam = ALL_EXAMS[currentExamKey];

      exam.questions.forEach(q => {
        maxScore += q.points;
        document.getElementById(`exp-${q.id}`).classList.remove("hidden");

        if (q.type === "mcq") {
          const chosen = userAnswers[q.id];
          document.getElementById(`opt-${q.id}-${q.answer}`).classList.add("bg-green-50", "border-green-500", "ring-1", "ring-green-500");
          if (chosen === q.answer) totalScore += q.points;
          else if (chosen !== undefined) document.getElementById(`opt-${q.id}-${chosen}`).classList.add("bg-red-50", "border-red-500");
        } else if (q.type === "tf") {
          let correct = 0;
          const uObj = userAnswers[q.id] || {};
          q.subQuestions.forEach((sub, sIdx) => {
            const row = document.getElementById(`tf-row-${q.id}-${sIdx}`);
            if (uObj[sIdx] === sub.answer) { correct++; row.classList.add("bg-green-50"); }
            else { row.classList.add("bg-red-50"); row.insertAdjacentHTML("beforeend", `<span class="text-xs font-bold text-red-600 ml-2">(Đúng: ${sub.answer ? "ĐÚNG" : "SAI"})</span>`); }
          });
          const ratios = [0, 0.1, 0.25, 0.5, 1.0];
          totalScore += q.points * ratios[correct];
        } else if (q.type === "short") {
          const input = document.getElementById(`short-input-${q.id}`);
          input.disabled = true;
          const uVal = (userAnswers[q.id] || "").toLowerCase();
          if (uVal === q.answer.toLowerCase()) {
            totalScore += q.points;
            input.classList.add("bg-green-50", "border-green-500", "text-green-800");
          } else {
            input.classList.add("bg-red-50", "border-red-500", "text-red-800");
            input.insertAdjacentHTML("afterend", `<span class="ml-3 text-sm font-bold text-green-700">Đáp số: ${q.answer}</span>`);
          }
        }
      });

      document.getElementById("submit-bar").classList.add("hidden");
      const banner = document.getElementById("result-banner");
      banner.classList.remove("hidden");
      document.getElementById("score-text").innerText = `${totalScore.toFixed(2)} / ${maxScore.toFixed(2)} điểm`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initSelector();
      startTimer();
      renderQuiz();
    });
  </script>
</body>
</html>
